name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install viewer test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Generate viewer fixture
        run: python3 -m tools.make_viewer_fixture .render-fixture

      - name: Check viewer reducers
        run: node tools/check_viewer.mjs .render-fixture viewer.html

      - name: Check viewer rendering
        run: npx playwright test
